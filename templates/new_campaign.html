{% extends "base.html" %}{% block content %}<a class="back" href="{{ url_for('dashboard') }}">← Dashboard</a><section class="card form-card"><p class="eyebrow">NEW EXERCISE</p><h1>Create a campaign</h1><p class="muted">Messages are clearly marked as authorized awareness exercises. Delivery is restricted to addresses in your TEST_RECIPIENTS allowlist.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Campaign name<input name="name" placeholder="Q4 Security Awareness" required></label><label>Email subject<input name="subject" placeholder="Security awareness exercise" required></label><label>Message<textarea name="body" rows="6" placeholder="Write the exercise message..." required></textarea></label><label>Test recipient emails<textarea name="recipients" rows="4" placeholder="tester@example.com&#10;another@example.com" required></textarea><small>One address per line. Only allowlisted inboxes can receive messages.</small></label><button class="primary">Create and send test campaign</button></form></section>{% endblock %}
